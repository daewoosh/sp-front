name: Build & Deploy sp-front

# Проверка на пуш в develop: lint, test, dev-сборка. Выкатки здесь больше нет:
#   dev-образ для стенда в AWS собирает build-image-dev.yml (пуш в develop),
#   прод-образ по тегу v* — build-image.yml, версия уходит в safe-poker-deploy.
# Старые шаги rsync на машину в Яндексе удалены при переезде в AWS.

on:
  push:
    branches: [develop]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20        # тот же major, что в образе (Dockerfile: FROM node:20)
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint & test
        run: |
          npx nx lint sp-front
          npx nx test sp-front

      - name: Build (build:dev)
        run: npm run build:dev
