<form [formGroup]="form" class="lead-form" (ngSubmit)="save()" #leadForm="ngForm">
  <tui-loader [overlay]="true" size="xxl" [showLoader]="isLoading">
    <div class="flex flex-col gap-[6px]">
      <div class="lead-form-input-wrapper">
        <input
          class="lead-form-input"
          formControlName="name"
          placeholder="Ваше имя"
          [ngClass]="{ 'invalid-outline': form.controls['name'].invalid && leadForm.submitted }"
        />
        <div class="error-message">
          <span *ngIf="form.controls['name'].invalid && leadForm.submitted"> {{ getErrorMessage('name') }}</span>
        </div>
      </div>

      <div class="lead-form-input-wrapper">
        <input
          class="lead-form-input"
          formControlName="telegram"
          placeholder="Telegram username (пример @durov)"
          [ngClass]="{ 'invalid-outline': form.controls['telegram'].invalid && leadForm.submitted }"
        />
        <div class="error-message">
          <span *ngIf="form.controls['telegram'].invalid && leadForm.submitted">{{ getErrorMessage('telegram') }}</span>
        </div>
      </div>

      <div class="lead-form-input-wrapper">
        <input
          class="lead-form-input"
          formControlName="phone"
          placeholder="Телефон"
          [tsMask]="tsMask"
          [ngClass]="{ 'invalid-outline': form.controls['phone'].invalid && leadForm.submitted }"
        />
        <div class="error-message">
          <span *ngIf="form.controls['phone'].invalid && leadForm.submitted"> {{ getErrorMessage('phone') }}</span>
        </div>
      </div>

      <div class="lead-form-input-wrapper">
        <input
          class="lead-form-input"
          formControlName="email"
          placeholder="Электронная почта"
          [ngClass]="{ 'invalid-outline': form.controls['email'].invalid && leadForm.submitted }"
        />
        <div class="error-message">
          <span *ngIf="form.controls['email'].invalid && leadForm.submitted">{{ getErrorMessage('email') }}</span>
        </div>
      </div>
    </div>

    <div class="flex flex-col md:flex-row-reverse flex-wrap gap-2 items-center mt-4">
      <button class="btn primary w-full md:w-fit lead-submit">Отправить заявку</button>
      <div class="flex-grow flex text-base">
        Время работы: 10:00 - 19:00 -
        <a href="https://t.me/SafePoker_Sales" target="_blank">
          <svg class="ml-2 cursor-pointer" width="24" height="24" viewBox="0 0 24 24" fill="none"
               xmlns="http://www.w3.org/2000/svg">
            <path
              d="M12.1992 23C18.2744 23 23.1992 18.0751 23.1992 12C23.1992 5.92485 18.2744 1 12.1992 1C6.12409 1 1.19922 5.92485 1.19922 12C1.19922 18.0751 6.12409 23 12.1992 23Z"
              stroke="white" stroke-width="0.5" stroke-miterlimit="10" stroke-linecap="round" />
            <path
              d="M8.49844 12.5999L9.69846 15.9999C9.69846 15.9999 9.89844 16.2999 9.99844 16.2999C10.1984 16.2999 12.5984 13.6999 12.5984 13.6999L15.2984 8.3999L8.39844 11.5999L8.49844 12.5999Z"
              stroke="white" stroke-width="0.275" stroke-miterlimit="10" stroke-linecap="round" />
            <path
              d="M10.2985 13.5996L9.89853 15.9996C9.89853 15.9996 9.79854 16.7996 10.5985 15.9996C11.3985 15.1996 12.0985 14.5996 12.0985 14.5996"
              stroke="white" stroke-width="0.275" stroke-miterlimit="10" stroke-linecap="round" />
            <path
              d="M8.59933 12.6999L6.09933 11.8999C6.09933 11.8999 5.79931 11.7999 5.89931 11.4999C5.89931 11.3999 5.99933 11.3999 6.09933 11.2999C6.69933 10.8999 16.4993 7.39991 16.4993 7.39991C16.4993 7.39991 16.7993 7.29991 16.8993 7.39991C16.9993 7.39991 16.9993 7.49991 17.0993 7.59991C17.0993 7.69991 17.0993 7.69992 17.0993 7.79992C17.0993 7.89992 17.0993 7.89992 17.0993 7.99992C16.9993 8.99992 15.1993 16.1999 15.1993 16.1999C15.1993 16.1999 15.0993 16.5999 14.6993 16.5999C14.4993 16.5999 14.2993 16.4999 14.1993 16.3999C13.3993 15.6999 10.7993 13.9999 10.1993 13.5999C10.1993 13.5999 10.1993 13.5999 10.1993 13.4999V13.3999C10.1993 13.3999 14.7993 9.39991 14.8993 8.89991C14.8993 8.89991 14.8993 8.89991 14.7993 8.89991C14.4993 8.99991 9.29933 12.2999 8.69933 12.6999H8.59933Z"
              fill="white" />
          </svg>
        </a>

      </div>
    </div>
    <div class="clr-grey text-xs mt-[29px] text-end max-w-[458px]">Нажимая кнопку, вы соглашаетесь с <a
      class="text-white"
      routerLink="/agreement">политикой
      обработки
      данных</a>.
    </div>
  </tui-loader>
</form>
