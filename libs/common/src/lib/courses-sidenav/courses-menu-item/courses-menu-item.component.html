<a [routerLink]="menuItem.url"
   routerLinkActive="pointer-events-none"
   [routerLinkActiveOptions]="{exact: menuItem.url === '.'}"
   >
  <div class="flex gap-3 items-center py-[10px] px-7" routerLinkActive="item-active"
       [routerLinkActiveOptions]="{exact: menuItem.url === '/courses'}">
    <img [src]="'/assets/images/courses/'+menuItem.icon">
    <span class="text-base">{{menuItem.title}}</span>
  </div>
</a>
