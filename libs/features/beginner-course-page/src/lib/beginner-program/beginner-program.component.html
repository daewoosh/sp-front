<div class="max-w-6xl mx-auto py-16 px-8 xl:px-0  md:py-24" id="beginner-program">
  <div class="text-[30px]">
    Программа курса
  </div>
  <div class="clr-grey text-[21px] mt-4 mb-10">
    13 блоков и 16 подробных видеоуроков с тестовыми заданиями
  </div>
  <div class="grid max-w-[40rem] mx-auto grid-cols-1 gap-8 lg:gap-12 lg:max-w-none lg:grid-cols-2 items-start">
    <div>
      <sp-course-accordion [index]="1" head="Как играть в покер, не вкладывая денег" [isOpened]="true">
        <sp-watch-video videoUrl="https://www.youtube.com/watch?v=YwkfG3-QX7c"></sp-watch-video>
      </sp-course-accordion>
      <sp-course-accordion [index]="2" head="Настройка игровых клиентов для удобной игры"
                            [isExpandable]="false"></sp-course-accordion>
      <sp-course-accordion [index]="3" head="Селект: какие турниры играть новичку"
                            [isExpandable]="false"></sp-course-accordion>
      <sp-course-accordion [index]="4" head="Банкролл-менеджмент:
как не остаться без денег на игру"
                            [isExpandable]="false"></sp-course-accordion>
      <sp-course-accordion [index]="5" head="Игра на префлопе: чарты, ренджи открытия,
3-бет и колд-колл"
                            [isExpandable]="false"></sp-course-accordion>
      <sp-course-accordion [index]="6" head="Игра на постфлопе: диапазоны, контбеты,
когда делать пас"
                            [isExpandable]="false"></sp-course-accordion>
    </div>
    <div>
      <sp-course-accordion [index]="7" head="Сайзинги: выбор правильного размера ставок" [isExpandable]="false">
      </sp-course-accordion>
      <sp-course-accordion [index]="8" head="Покерная математика простым языком. Факторы принятия верных решений"
                            [isExpandable]="false"></sp-course-accordion>
      <sp-course-accordion [index]="9" head="Принципы игры в мультипоте
(против нескольких соперников)"
                            [isExpandable]="false"></sp-course-accordion>
      <sp-course-accordion [index]="10"
                            head="Модель ICM: как зарабатывать больше денег в условиях баббла и на финальном столе"
                            [isExpandable]="false"></sp-course-accordion>
      <sp-course-accordion [index]="11" head="Психология покера: рекомендации по
борьбе с тильтом"
                            [isExpandable]="false"></sp-course-accordion>
      <sp-course-accordion [index]="12" head="Базовый покерный софт"
                            [isExpandable]="false"></sp-course-accordion>
      <sp-course-accordion [index]="13" head="Заключение и инструкция по получению
бонусов на игру"
                            [isExpandable]="false"></sp-course-accordion>
    </div>
  </div>


</div>
