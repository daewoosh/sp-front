<div class="page-header">
  <div class="page-header-container">
    <div class="page-header-content-wrapper">
      <div class="max-w-[800px]">
        <div
          class="text-[30px] md:text-[36px] font-medium lg:text-[48px] leading-snug lg:leading-[60px] xl:max-w-[450px] text-white">
          Анализ раздач
          в покере
        </div>
        <div class="page-header-description max-w-[582px]">
          Прокачайте свой уровень игры<br>
          вместе с профессиональным тренером.
        </div>
        <div class="page-header-actions">
            <button class="btn w-full primary md:w-fit page-header-button-glow" routerLink='.' fragment="analysis-payment"
                    [queryParams]="localStorage.get('utm')">Записаться на разбор базы
            </button>
          <button class="btn w-full md:w-fit" routerLink='.' fragment="analysis-content"
                  [queryParams]="localStorage.get('utm')">
            Узнать больше
          </button>
        </div>
      </div>
      <div class="page-header-image-container sm:flex-shrink-1">
        <div class="page-header-image-wrapper top-images">
          <div class="page-header-logo-glow">
            <img src="assets/images/analysis/logo-top.png">
          </div>
        </div>
      </div>
    </div>

    <div class="page-header-features-grid">
      <div class="flex gap-6 items-center">
        <img width="43" src="assets/images/analysis/top-domino.svg">
        <div class="text-white text-base lg:max-w-[239px]">Проанализируем вашу игру
          в кратчайшие сроки.
        </div>
      </div>
      <div class="flex gap-6 items-center">
        <img width="43" src="assets/images/analysis/top-chips.svg">
        <div class="text-white text-base  lg:max-w-[215px]">Выявим ошибки, на которых
          вы теряете деньги.
        </div>
      </div>
      <div class="flex gap-6 items-center">
        <img width="43" src="assets/images/analysis/top-hands.svg">
        <div class="text-white text-base lg:max-w-[216px]">Дадим чёткие рекомендации
          по их устранению.
        </div>
      </div>
    </div>

  </div>
</div>
