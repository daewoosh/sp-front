<div class="lg:hidden">
  <sp-choose-path-block imgSrc="/assets/images/main/beginner.png"
                         header="Осознанное начало" goTo="/beginner"
                         name="Онлайн-курс"
                         imageMargin="65px"
                         bottomMargin="25px">
    <div class="clr-grey text-xs">(для начинающих игроков)</div>
    <p class="mt-7">Результат:</p>
    <sp-text-with-check text="Вы узнаете об основах игры на префлопе
и постфлопе, а также внедрите актуальную стратегию для игры на микролимитах"></sp-text-with-check>

    <sp-text-with-check text="Познакомитесь с базовой
математикой покера, чтобы
видеть понятный и
прогнозируемый результат
своей игры"></sp-text-with-check>

    <sp-text-with-check text="Узнаете, как анализировать
различные ситуации в покере
и извлекать максимум выгоды из каждой руки"></sp-text-with-check>

    <sp-text-with-check text="Освоите принципы
банкролл-менеджмента"></sp-text-with-check>
    <sp-text-with-check text="Получите актуальные префлоп- чарты и таблицы пуш-фолда"></sp-text-with-check>
    <sp-text-with-check text="Освоите базовые техники по
борьбе с тильтом и перестанете
срываться"></sp-text-with-check>
    <sp-text-with-check text="Сформируете комплексное
понимание игры и узнаете как пользоваться базовым софтом"></sp-text-with-check>
    <sp-text-with-check text="Научитесь лучше понимать
оппонентов и игру в целом"></sp-text-with-check>
    <sp-text-with-check text="Снизите до минимума
элемент удачи в игре"></sp-text-with-check>
  </sp-choose-path-block>
</div>
<div class="lg:hidden">
  <sp-choose-path-block imgSrc="/assets/images/main/only-poker.png"
                         header="Only Покер" goTo="/only-poker"
                         name="Онлайн-курс"
                         imageMargin="65px"
                         bottomMargin="25px">
    <div class="clr-grey text-xs">(для игроков до ABI 50)</div>
    <p class="mt-7">Вы получите:</p>
    <sp-text-with-check text="9 ёмких видеоуроков с пошаговыми стратегиями, которые позволяют постепенно осваивать материал без перегрузки"></sp-text-with-check>

    <sp-text-with-check text="Структурированный концентрат знаний без лишней воды"></sp-text-with-check>

    <sp-text-with-check text="Домашние задания для закрепления полученных знаний без необходимости работы с тренером"></sp-text-with-check>

    <sp-text-with-check text="Помощь Куратора курса, который будет вашим проводником, советчиком и мотиватором в одном флаконе"></sp-text-with-check>
    <sp-text-with-check text="Сотни актуальных ренжей для игры с разных позиций и в разной глубине стеков!"></sp-text-with-check>

    <sp-text-with-check text="Вы освоите базовые понятия о покере, а также значительно продвинетесь в понимании игры на разных стадиях турниров"></sp-text-with-check>
    <sp-text-with-check text="Курс расскажет вам о нюансах игры на всех позициях и в разных глубинах, помогая в дальнейшем принимать верные решения и снижая дисперсию."></sp-text-with-check>
  </sp-choose-path-block>
</div>
