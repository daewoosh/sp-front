  <svg width="26" height="26" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg">

      d="M12.9994 26C20.1745 26 26 20.1745 26 12.9993C26 5.82416 20.1745 0 12.9994 0C5.82546 0 0 5.82416 0 12.9993C0 20.1745 5.82546 26 12.9994 26ZM12.9994 15.5974C12.461 15.5974 12.0241 15.1605 12.0241 14.6222V7.47037C12.0241 6.93203 12.461 6.49512 12.9994 6.49512C13.5377 6.49512 13.9746 6.93203 13.9746 7.47037V14.6222C13.9746 15.1605 13.5377 15.5974 12.9994 15.5974ZM12.9967 19.4984C12.279 19.4984 11.6964 18.9158 11.6964 18.198C11.6964 17.4803 12.279 16.8977 12.9967 16.8977C13.7145 16.8977 14.2971 17.4803 14.2971 18.198C14.2971 18.9158 13.7145 19.4984 12.9967 19.4984Z"
      fill="#2BBE16"/>
  </svg>
  <div class="text-base text-white">Внимательно прочтите и выполните все задания из списка. После отправки ответов, вы сможете проверить себя или перепройти домашнее задание заново.</div>
</div>

<div class="assignment">
  <ng-container *ngFor="let question of courseElement.questions">
    <sp-course-item-assignment-question [courseElement]="courseElement" [question]="question"/>
  </ng-container>
  <div class="flex justify-end">
    <button class="btn primary" (click)="sendAnswers()" *ngIf="!courseElement.isCompleted || isResetMode">Отправить ответы</button>
    <button class="btn warning" (click)="resetAnswers()" *ngIf="courseElement.isCompleted && !isResetMode">Перепройти тест</button>
  </div>
</div>

<div class="w-full flex flex-wrap justify-end gap-4 mt-12">
  <button class="btn"
          [routerLink]="['../',courseElement.order-1]"
          [ngClass]="{'hidden':!showPrevBtn}">
    Предыдущий урок
  </button>
  <button class="btn primary" [attr.inert]="!canGoNext || null"
          [routerLink]="['../',courseElement.order+1]"
          [ngClass]="{'hidden':!showNextBtn, 'disabled':!canGoNext}">
    Перейти к домашнему заданию
  </button>
</div>
