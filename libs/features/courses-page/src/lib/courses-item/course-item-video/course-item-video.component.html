<div>
  <vg-player (onPlayerReady)="onPlayerReady($event)" *ngIf="canShowPlayer">
    <vg-overlay-play vgFor="myMedia2"></vg-overlay-play>

    <vg-controls *ngIf="bitrates.length" class="h-[70px]" [vgAutohide]="true">
      <!--      <vg-scrub-bar>-->
      <!--        <vg-scrub-bar-current-time vgFor="myMedia2" [vgSlider]="true"></vg-scrub-bar-current-time>-->
      <!--        <vg-scrub-bar-buffering-time vgFor="myMedia2"></vg-scrub-bar-buffering-time>-->
      <!--      </vg-scrub-bar>-->
      <div class="flex-grow pr-5">
        <vg-scrub-bar class="block h-[20px]">
          <vg-scrub-bar-current-time vgFor="myMedia2" [vgSlider]="true"></vg-scrub-bar-current-time>
          <vg-scrub-bar-buffering-time vgFor="myMedia2"></vg-scrub-bar-buffering-time>
        </vg-scrub-bar>
        <div class="flex justify-between">
          <div class="flex gap-2">
            <vg-play-pause vgFor="myMedia2"></vg-play-pause>
<!--            <vg-playback-button vgFor="myMedia2" [playbackValues]="['0.5', '1.0', '2.0', '4.0' ]"></vg-playback-button>-->

            <button tuiDropdownOpen
                    type="button"
                    [tuiDropdown]="contentSpeed">
              {{selectedSpeed?.label ?? ''}}
            </button>

            <ng-template #contentSpeed
                         let-close>
              <div *ngFor="let item of speeds" class="flex gap-1 flex-col p-2 bg-[#1C1E1D] text-white text-base">
                <button type="button" class="hover:bg-[var(--clr-primary)] px-2 rounded" (click)="myMedia.playbackRate = item.value;selectedSpeed = item;close()">
                  {{item.label}}
                </button>
              </div>
            </ng-template>

            <vg-time-display vgFor="myMedia2" [vgProperty]="'current'" [vgFormat]="'mm:ss'"></vg-time-display>
          </div>
          <div class="flex gap-2">
            <!--            <vg-quality-selector [bitrates]="bitrates" class="qSelector"-->
            <!--                                 (onBitrateChange)="vgHls.setBitrate($event)">-->

            <!--            </vg-quality-selector>-->


            <button tuiDropdownOpen
                    type="button"
                    [tuiDropdown]="content">
              {{selectedBitrate?.label ?? ''}}
            </button>

            <ng-template #content let-close>
              <div *ngFor="let item of bitrates" class="flex gap-1 flex-col p-2 bg-[#1C1E1D] text-white text-base">
                <button type="button" class="hover:bg-[var(--clr-primary)] px-2 rounded" (click)="vgHls.setBitrate(item);selectedBitrate = item;close()">
                  {{item.label}}
                </button>
              </div>
            </ng-template>

            <vg-mute vgFor="myMedia2"></vg-mute>
            <vg-volume vgFor="myMedia2" class="hidden sm:inline-flex"></vg-volume>
            <vg-fullscreen vgFor="myMedia2"></vg-fullscreen>
          </div>
        </div>
      </div>
    </vg-controls>

    <video #myMedia
           [vgMedia]="aaaa(myMedia)"
           [vgHls]="getVideoUrl()"
           #vgHls="vgHls"
           (onGetBitrates)="getBitrates($event)"
           id="myMedia2"
           type="video/mp4"
           crossorigin
    >
    </video>

<div class="w-full flex flex-wrap justify-end gap-4 mt-12">
  <button class="btn"
          [routerLink]="['../',courseElement.order-1]"
          [ngClass]="{'hidden':!showPrevBtn}">
    Предыдущий урок
  </button>
  <button class="btn primary" [attr.inert]="!canGoNext || null"
          [routerLink]="['../',courseElement.order+1]"
          [ngClass]="{'hidden':!showNextBtn, 'disabled':!canGoNext}">
    Перейти к домашнему заданию
  </button>
</div>
<div class="mt-14">
  <div class="text-2xl">Описание</div>
  <div class="text-base" [innerHTML]="courseElement.description"></div>
</div>
