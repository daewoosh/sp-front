<div class="course-card">
  <div class="text-[21px] leading-[25px]">{{course.title}}</div>
  <div class="text-xs clr-grey">{{course.subtitle}}</div>
  <div class="mt-4 2xl:h-[260px]">
    <img class="mx-auto" [src]="'assets/images/courses/'+course.image"/>
  </div>
  <div class="text-sm leading-4 mt-4 mb-6">
    {{course.description}}
  </div>
  <div class="flex justify-end mt-auto">
    <a class="btn primary font-bold" *ngIf="course.isAvailable" [routerLink]="'./'+course.slug">К обучению</a>
    <button class="btn warning font-bold" [routerLink]="'./'+course.slug" *ngIf="!course.isAvailable"
            (click)="showDialog(template)">Открыть доступ
    </button>
  </div>

</div>


<ng-template
  #template
  let-observer
>
  <div class="text-center clr-orange text-2xl"><p>Упс!</p></div>
  <div class="flex flex-col text-base">
    <p>
      У вас нет доступа к этому курсу.
    </p>
    <p class="mt-[22px]">
      Чтобы начать обучение, выберите продукт и заполните заявку на приобретение курса на нашем сайте.
    </p>
    <p class="mt-8">
      Заполнив заявку, вы получите бесплатную консультацию у наших менеджеров.
    </p>
  </div>


  <div class="flex justify-end mt-12">
    <button class="btn primary">
      Выбрать курс
    </button>
  </div>

</ng-template>
