<div class="max-w-[1440px]">
  <p class="text-white text-4xl mb-8" *ngIf="profile$|async as profile">
    Добро пожаловать, {{profile.displayName ?? ""}}!
  </p>

  <div class="flex items-center gap-4 justify-between flex-wrap">
    <span class="text-2xl">Все продукты SafePoker</span>
    <div class="btn-link">Видео-курсы</div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 md:gap-10 xl:gap-16 mt-10">
    <ng-container *ngFor="let course of courses$|async">
      <sp-course-card [course]="course"/>
    </ng-container>
  </div>
</div>
