<div class="text-base">
  <select>
    <option *ngFor="let course of courses" [value]="course.id">{{ course.name }}</option>
  </select>
  <div class="mt-3">
    <button class="btn primary" (click)="createAccessLink()">Выдать доступ</button>
  </div>
  <ng-container *ngIf="createdLink">
    <span>Ссылка для активации: <br/>{{createdLink}}</span>
  </ng-container>
</div>
