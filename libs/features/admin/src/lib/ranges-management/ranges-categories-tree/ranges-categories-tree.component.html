<tui-tree
  *ngFor="let item of categories"
  [childrenHandler]="handler"
  [content]="content"
  [tuiTreeController]="true"
  [value]="item"
  [map]="map"
  [trackBy]="trackById"
/>

<ng-template
  #content
  let-item
>
  <span class="text-base" (click)="selectAction(item)"
        [ngClass]="
        {
        'clr-primary text-lg':item.level===3 && item.id === selectedActionId,
        'cursor-pointer':item.level===3
        }">
    {{ item.name }}
  </span>
</ng-template>
