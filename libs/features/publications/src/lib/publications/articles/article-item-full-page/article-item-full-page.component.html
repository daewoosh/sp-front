<div class="publication-page">
  <div class="max-w-6xl  mx-auto py-12 px-8 xl:px-0">
    <a class="btn block flex-1 w-[195px]" routerLink="/articles">
      <div class="flex items-center justify-center gap-2">
        <svg width="13" height="22" viewBox="0 0 13 22" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path fill-rule="evenodd" clip-rule="evenodd"

                fill="white"/>
        </svg>
        К списку статей
      </div>
    </a>
    <div *ngIf="publication$|async as publication">
      <app-article-full-content [publication]="publication"></app-article-full-content>
    </div>
  </div>
</div>
